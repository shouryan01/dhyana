<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dhyāna</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Static splash: visible before JS loads; removed once the vault is open. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f6efe2;
        color: #8a7c66;
        font:
          500 15px/1 system-ui,
          sans-serif;
        letter-spacing: 0.02em;
        transition: opacity 0.15s;
        z-index: 100;
      }
      #splash .mark {
        font:
          600 34px/1 Georgia,
          serif;
        color: #5b4a33;
        letter-spacing: 0.01em;
      }
      #splash img {
        width: 72px;
        height: 72px;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/logo.svg" alt="" />
      <div class="mark">dhyāna</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
